[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cybersecuritysuite"
version = "0.1.0"
description = "AI-Assisted Cybersecurity, Penetration Testing & CPENT Learning Platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "CyberSecuritySuite Team" }
]
dependencies = [
    "PySide6>=6.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
